# ⚠️ SECURITY: Change CHANGE_ME_STRONG_PASSWORD below before deploying.
# Using the placeholder password will expose your Bitcoin RPC to attackers.

[Application Options]
listen=0.0.0.0:9735
rpclisten=0.0.0.0:10009
restlisten=0.0.0.0:8080
tlsautorefresh=true

[Bitcoin]
bitcoin.active=true
bitcoin.mainnet=true
bitcoin.node=bitcoind

[Bitcoind]
bitcoind.rpchost=bitcoind:8332
bitcoind.rpcuser=satgateway
bitcoind.rpcpass=CHANGE_ME_STRONG_PASSWORD
bitcoind.zmqpubrawblock=tcp://bitcoind:28332
bitcoind.zmqpubrawtx=tcp://bitcoind:28333
