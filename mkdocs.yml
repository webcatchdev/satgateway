site_name: SatGateway
site_url: https://webcatchdev.github.io/satgateway
site_description: Bitcoin Lightning payments for websites and APIs
theme:
  name: material
  palette:
    - scheme: slate
      primary: orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - toc.integrate
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Configuration: config.md
  - Security: security.md
  - Changelog: changelog.md
