[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satgateway"
version = "0.1.0"
description = "Bitcoin Lightning payments for websites and APIs"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "bellum19"}
]
keywords = ["bitcoin", "lightning", "payments", "micropayments", "api", "paywall"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "python-multipart>=0.0.6",
    "aiohttp>=3.8",
    "jinja2>=3.1",
    "qrcode[pil]>=7.4",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.24",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/bellum19/satgateway"
Documentation = "https://github.com/bellum19/satgateway#readme"
Repository = "https://github.com/bellum19/satgateway"
Issues = "https://github.com/bellum19/satgateway/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["satgateway*"]
