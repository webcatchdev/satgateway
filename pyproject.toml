[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "satgateway"
version = "0.1.0"
description = "Bitcoin Lightning payments for websites and APIs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "bellum19", email = "security@satgateway.local"}
]
keywords = [
    "bitcoin",
    "lightning",
    "payments",
    "micropayments",
    "fastapi",
    "paywall",
    "x402"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "aiohttp",
    "jinja2",
    "qrcode[pil]",
    "redis",
    "websockets",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/bellum19/satgateway"
Documentation = "https://bellum19.github.io/satgateway"
Repository = "https://github.com/bellum19/satgateway"
Issues = "https://github.com/bellum19/satgateway/issues"
Changelog = "https://github.com/bellum19/satgateway/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["satgateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
