version: "3.8"

services:
  satgateway:
    build: .
    container_name: satgateway
    ports:
      - "9026:9026"
    environment:
      - SATGATEWAY_KEY=${SATGATEWAY_KEY}
      - SATGATEWAY_FEE_BPS=${SATGATEWAY_FEE_BPS:-50}
      # Optional: connect to your LND node
      # - LND_HOST=https://host.docker.internal:8080
      # - LND_MACAROON=${LND_MACAROON}
      # - LND_CERT_PATH=/app/lnd/tls.cert
    volumes:
      - ./data:/app/data
    restart: unless-stopped
